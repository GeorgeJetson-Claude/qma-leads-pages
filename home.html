<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home project quotes | Quote My Anything</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav"><a class="logo" href="index.html">QMA</a><nav><a class="btn btn-sm" href="#quote">Get quotes</a></nav></header>
  <section class="split">
    <div>
      <p class="eyebrow">Home-fix stack</p>
      <h1>One request for the house work you keep putting off.</h1>
      <p class="lede">HVAC, remodel, yard, plumbing — routed onto the QMA home-fix and city quote pages.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" /><input type="hidden" name="source" value="qma-home" />
      <h2>Request quotes</h2>
      <label>Name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>ZIP / city <input name="zip" required /></label>
      <label>Project type <select name="project"><option>HVAC</option><option>Remodel</option><option>Yard / landscape</option><option>Plumbing</option><option>Electrical</option><option>Other</option></select></label>
      <label>Details <textarea name="details" rows="4" required></textarea></label>
      <button class="btn" type="submit">Get my quotes</button>
    </form>
  </section>
</body></html>
