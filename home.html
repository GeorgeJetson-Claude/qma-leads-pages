<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home project quotes — Quote My Anything</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html">QMA</a>
    <nav><a href="index.html">All verticals</a><a class="btn btn-sm" href="#quote">Get home quotes</a></nav>
  </header>
  <section class="split">
    <div>
      <p class="eyebrow">Home services · already built</p>
      <h1>One request. Multiple local quotes.</h1>
      <p class="lede">Sits on top of the QMA home-fix and city pages — HVAC, kitchen, bath, fence, yard, plumbing, pest, pool.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" />
      <input type="hidden" name="vertical" value="home" />
      <label>Name <input name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Phone <input type="tel" name="phone"></label>
      <label>ZIP / city <input name="zip" required placeholder="78701"></label>
      <label>Job type
        <select name="job">
          <option>HVAC</option>
          <option>Kitchen / bath</option>
          <option>Plumbing / electrical</option>
          <option>Yard / fence / deck</option>
          <option>Pest / pool / other</option>
        </select>
      </label>
      <label>What needs to happen? <textarea name="details" rows="4"></textarea></label>
      <button class="btn" type="submit">Get contractor quotes</button>
    </form>
  </section>
  <footer><p><a href="index.html">← All QMA lead pages</a></p></footer>
</body>
</html>
