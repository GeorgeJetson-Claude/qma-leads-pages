<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wellness quotes — Quote My Anything</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html">QMA</a>
    <nav>
      <a href="index.html">All verticals</a>
      <a class="btn btn-sm" href="#quote">Book a consult</a>
    </nav>
  </header>
  <section class="split">
    <div>
      <p class="eyebrow">Med spa / wellness</p>
      <h1>Consult first. Price second.</h1>
      <p class="lede">Front door for Larkspur Med Spa and related QMA wellness properties.</p>
    </div>
    <form id="quote" class="lead-form panel" action="thank-you.html" method="get">
      <input type="hidden" name="vertical" value="wellness" />
      <label>Name <input name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Phone <input type="tel" name="phone"></label>
      <label>Interested in
        <select name="treatment">
          <option>Facial / skin</option>
          <option>Injectables consult</option>
          <option>Body / contour</option>
          <option>Not sure — want a plan</option>
        </select>
      </label>
      <label>Preferred time
        <select name="when">
          <option>This week</option>
          <option>This month</option>
          <option>Just pricing</option>
        </select>
      </label>
      <button class="btn" type="submit">Request consult / quote</button>
    </form>
  </section>
  <footer><p><a href="index.html">← All QMA lead pages</a></p></footer>
</body>
</html>
