<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electrical quotes | Quote My Anything</title>
  <meta name="description" content="Panel upgrades, outlets, EV chargers, lighting — get electrical quotes from local licensed partners." />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav"><a class="logo" href="index.html">QMA</a><nav><a href="home.html">Home</a><a class="btn btn-sm" href="#quote">Get quotes</a></nav></header>
  <section class="split">
    <div>
      <p class="eyebrow">Home · Electrical</p>
      <h1>Panel, outlets, EV charger — quote it before you book a spark.</h1>
      <p class="lede">Sits on the QMA electrical estimator already shipped. One form, multiple licensed replies.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" />
      <input type="hidden" name="source" value="qma-electrical" />
      <input type="hidden" name="vertical" value="electrical" />
      <h2>Request electrical quotes</h2>
      <label>Name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>ZIP / city <input name="zip" required /></label>
      <label>Job
        <select name="project">
          <option>Panel upgrade</option>
          <option>Outlets / lighting</option>
          <option>EV charger</option>
          <option>Whole-home inspect</option>
          <option>Other</option>
        </select>
      </label>
      <label>Details <textarea name="details" rows="4" required></textarea></label>
      <button class="btn" type="submit">Get my quotes</button>
    </form>
  </section>
</body></html>
