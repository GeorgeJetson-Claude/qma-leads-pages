<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collectible quotes — Quote My Anything</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html">QMA</a>
    <nav><a href="index.html">All verticals</a><a class="btn btn-sm" href="#quote">Get a price</a></nav>
  </header>
  <section class="split">
    <div>
      <p class="eyebrow">Pokémon · retro · VHS</p>
      <h1>Get a quote on cards, games, tapes.</h1>
      <p class="lede">Feeds the kid-friendly Pokémon / retro / VHS / DVD / CD quote property already built.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" />
      <input type="hidden" name="vertical" value="collect" />
      <label>Name <input name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>I have
        <select name="job">
          <option>Pokémon / trading cards</option>
          <option>Retro games</option>
          <option>VHS / DVD / CD / tapes</option>
          <option>Mixed lot</option>
        </select>
      </label>
      <label>What is it? <textarea name="details" rows="4" placeholder="Set, condition, quantity…"></textarea></label>
      <button class="btn" type="submit">Get my collectible quote</button>
    </form>
  </section>
  <footer><p><a href="index.html">← All QMA lead pages</a></p></footer>
</body>
</html>
