<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel & cruise quotes | Quote My Anything</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav"><a class="logo" href="index.html">QMA</a><nav><a class="btn btn-sm" href="#quote">Get quotes</a></nav></header>
  <section class="split">
    <div>
      <p class="eyebrow">Travel advisor stack</p>
      <h1>Get trip and cruise quotes without 40 tabs.</h1>
      <p class="lede">Dates, destination, budget. Routed through the QMA travel advisor and cruise-deck sites already live.</p>
      <ul class="trust"><li>Cruises, flights, multi-city trips</li><li>Budget ranges welcome</li><li>You pick who to book with</li></ul>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" /><input type="hidden" name="source" value="qma-travel" />
      <h2>Request quotes</h2>
      <label>Name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>ZIP / city <input name="zip" required /></label>
      <label>Destination <input name="destination" /></label>
      <label>Travel dates <input name="dates" /></label>
      <label>Details <textarea name="details" rows="4" required></textarea></label>
      <button class="btn" type="submit">Get my quotes</button>
    </form>
  </section>
</body></html>
