<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5Luv / media quotes | Quote My Anything</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav"><a class="logo" href="index.html">QMA</a><nav><a class="btn btn-sm" href="#quote">Get quotes</a></nav></header>
  <section class="split">
    <div>
      <p class="eyebrow">5Luv Inc + Tina AI</p>
      <h1>Quote the content, merch, or site.</h1>
      <p class="lede">Landing pages, merch pre-orders, and creator work sitting on the 5Luv / empire stack already live.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" /><input type="hidden" name="source" value="qma-media" />
      <h2>Request a quote</h2>
      <label>Name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>Need <select name="project"><option>Landing page</option><option>Merch / pre-order</option><option>Video package</option><option>Creator tools</option><option>Other</option></select></label>
      <label>Details <textarea name="details" rows="4" required></textarea></label>
      <button class="btn" type="submit">Get my quote</button>
    </form>
  </section>
</body></html>
