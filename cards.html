<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card lot quotes | Quote My Anything</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav"><a class="logo" href="index.html">QMA</a><nav><a class="btn btn-sm" href="#quote">Get quotes</a></nav></header>
  <section class="split">
    <div>
      <p class="eyebrow">Mom Cards</p>
      <h1>Get a number on the binder before you list it.</h1>
      <p class="lede">Sports, Pokémon, lots — sits on the Mom Cards property already built.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" /><input type="hidden" name="source" value="qma-cards" />
      <h2>Request a quote</h2>
      <label>Name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>What you have <select name="project"><option>Sports cards</option><option>Pokémon</option><option>Mixed lot</option><option>Single high-value</option><option>Other</option></select></label>
      <label>Details <textarea name="details" rows="4" required placeholder="Set, year, condition, photos coming..."></textarea></label>
      <button class="btn" type="submit">Get my quote</button>
    </form>
  </section>
</body></html>
