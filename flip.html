<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThriftFlip quotes — Quote My Anything</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html">QMA</a>
    <nav><a href="index.html">All verticals</a><a class="btn btn-sm" href="#quote">Price a flip</a></nav>
  </header>
  <section class="split">
    <div>
      <p class="eyebrow">ThriftFlip Hub</p>
      <h1>Price the lot before you haul it.</h1>
      <p class="lede">Lead page for the resale tracker property. Send what you found; get a number.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" />
      <input type="hidden" name="vertical" value="flip" />
      <label>Name <input name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Item or lot <input name="job" required placeholder="Vintage jacket lot, furniture, electronics…"></label>
      <label>Details <textarea name="details" rows="4" placeholder="Condition, what you paid, photos coming by email…"></textarea></label>
      <button class="btn" type="submit">Get a flip quote</button>
    </form>
  </section>
  <footer><p><a href="index.html">← All QMA lead pages</a></p></footer>
</body>
</html>
