<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get a quote | Quote My Anything</title>
  <meta name="description" content="Universal Quote My Anything lead form. One request. Routed to the property we already built." />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav"><a class="logo" href="index.html">QMA</a><nav><a class="btn btn-sm" href="#quote">Get quotes</a></nav></header>
  <section class="split">
    <div>
      <p class="eyebrow">Universal form</p>
      <h1>Quote anything we already built.</h1>
      <p class="lede">Travel, home, roof, auto, spa, collectibles, media, Rosie. Same Formspree inbox as the rest of the funnel.</p>
    </div>
    <form id="quote" class="lead-form panel" action="https://formspree.io/f/xdajvlvr" method="POST">
      <input type="hidden" name="_next" value="thank-you.html" />
      <input type="hidden" name="source" value="qma-get-quote" />
      <h2>Get quotes</h2>
      <label>Name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Phone <input type="tel" name="phone" /></label>
      <label>ZIP / city <input name="zip" required /></label>
      <label>Category
        <select name="vertical" required>
          <option value="">Choose</option>
          <option value="travel">Travel / cruise</option>
          <option value="home">Home project</option>
          <option value="hvac">HVAC</option>
          <option value="electrical">Electrical</option>
          <option value="roof">Roof</option>
          <option value="cleaning">Cleaning</option>
          <option value="auto">Auto / MagnaCars</option>
          <option value="wellness">Wellness / spa</option>
          <option value="insurance">Business insurance</option>
          <option value="collect">Collectibles</option>
          <option value="media">5Luv / media</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Details <textarea name="details" rows="4" required></textarea></label>
      <button class="btn" type="submit">Get my quotes</button>
    </form>
  </section>
</body></html>
